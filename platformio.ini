[platformio]
default_envs = debug

[env]
build_flags = 
  -std=gnu++17

[env:base]
platform = https://github.com/pioarduino/platform-espressif32#55.03.31
board = waveshare_esp32s3_touch_lcd_21
framework = arduino

board_build.f_cpu = 240000000L

build_flags =
  ${env.build_flags}
  -I include/waveshare_esp32s3_touch_lcd_21
  # ESP-IDF
  -D CONFIG_COMPILER_OPTIMIZATION_PERF
  # LVGL
  -D LV_CONF_SKIP
  # -D LV_ATTRIBUTE_FAST_MEM=IRAM_ATTR # seems to be broken currently (linker error)
  # -D LV_ATTRIBUTE_FAST_MEM=DRAM_ATTR # less optimized, also broken
  -D LV_DEF_REFR_PERIOD=41 # ms, 24 FPS
  -D LV_MEM_POOL_INCLUDE='"esp_heap_caps.h"'
  -D LV_MEM_POOL_ALLOC(size)="heap_caps_malloc(size, MALLOC_CAP_SPIRAM)"
  -D LV_MEM_SIZE="(120 * 1024U)"
  -D LV_COLOR_DEPTH=16
  -D LV_DPI_DEF=162
  # LVGL unused modules
  -D LV_BUILD_EXAMPLES=0
  # LVGL features
  -D LV_USE_ASSERT_NULL
  -D LV_USE_METER
  -D LV_USE_CHART

lib_deps =
  https://github.com/mairas/ReactESP#v3.3.1
  https://github.com/lvgl/lvgl.git#release/v9.5
  https://github.com/bblanchon/ArduinoJson#7.x
  https://github.com/RobTillaart/PCF8575#0.2.5

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time

[env:debug]
extends = env:base

build_unflags =
  ${env:base.build_unflags}
  -Og
  -O0
  -01
  -O2
build_flags =
  ${env:base.build_flags}
  -O0 # no optimizations
  # logging
  -D CORE_DEBUG_LEVEL=4 # arduino/esp-idf
  -D LOG_LOCAL_LEVEL=4 # app
  # LVGL logging
  -D LV_USE_LOG=1
  -D LV_LOG_LEVEL=4
  # LVGL performance overlay (FPS+CPU)
  -D LV_USE_SYSMON=1
  -D LV_USE_PERF_MONITOR=1
  -D LV_USE_PERF_MONITOR_POS=LV_ALIGN_BOTTOM_MID
build_type = debug

[env:release]
extends = env:base

build_unflags =
  ${env:base.build_unflags}
  -Og
  -O0
  -O1
  -O2
build_flags =
  ${env:base.build_flags}
  -Ofast # badass unstable optimizations
  -D CORE_DEBUG_LEVEL=2
  -D LOG_LOCAL_LEVEL=2
build_type = release

[env:release-with-perf]
extends = env:release

build_unflags = 
  ${env:release.build_unflags}
  -D CORE_DEBUG_LEVEL=2
  -D LOG_LOCAL_LEVEL=2
build_flags =
  ${env:release.build_flags}
  # logging
  -D CORE_DEBUG_LEVEL=4 # arduino/esp-idf
  -D LOG_LOCAL_LEVEL=4 # app
  # LVGL performance overlay (FPS+CPU)
  -D LV_USE_SYSMON=1
  -D LV_USE_PERF_MONITOR=1
  -D LV_USE_PERF_MONITOR_POS=LV_ALIGN_BOTTOM_MID
build_type = release

[env:unit-tests]
platform = native
build_flags =
  ${env.build_flags}
  -Wall
  -Wextra
  -D UNIT_TESTING
  -I lib/VESC/src
  -I test/test_native/include
test_filter = test_native
test_build_src = no
test_framework = unity
